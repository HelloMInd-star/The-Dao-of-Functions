<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易经 · 周期函数图谱</title>
    <style>
        /* 这里直接复用之前道德经的样式，只是把主题色改成蓝绿色系 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f4f5; font-family: system-ui, 'Georgia', serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar {
            width: 260px;
            background: #1e2c33;
            color: #b8ccd4;
            padding: 30px 0;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 6px;
            padding-bottom: 20px;
            border-bottom: 1px solid #3b5e6b;
            margin-bottom: 20px;
            color: #e6f0f2;
            font-size: 22px;
        }
        .menu-item {
            padding: 14px 30px;
            cursor: pointer;
            transition: 0.15s;
            border-left: 4px solid transparent;
            font-size: 16px;
            letter-spacing: 1px;
            color: #9bb5bf;
        }
        .menu-item:hover { background: #2d4750; color: #fff; }
        .menu-item.active {
            background: #2d4750;
            color: #e6f0f2;
            border-left-color: #5f9db0;
            font-weight: 500;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 50px;
            overflow-y: auto;
            background: #f9fcfa;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #d0dfe0;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .top-bar h1 { font-weight: 300; color: #1e2c33; font-size: 28px; letter-spacing: 4px; }
        .top-bar span {
            display: inline-block;
            background: #1e2c33;
            color: #e6f0f2;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .content-area { display: flex; gap: 40px; flex-wrap: wrap; flex: 1; }
        .canvas-wrapper {
            flex: 2;
            min-width: 300px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #d0dfe0;
        }
        canvas { width: 100%; height: auto; display: block; background: #ffffff; border-radius: 16px; }
        .info-wrapper {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card-box {
            background: #eaf1f2;
            border-radius: 24px;
            padding: 24px;
            border-left: 6px solid #3b5e6b;
        }
        .card-box .chapter { font-size: 13px; color: #4d6a73; letter-spacing: 2px; }
        .card-box .quote { font-size: 22px; line-height: 1.6; margin: 10px 0; color: #1e2c33; font-weight: 500; }
        .card-box .explain { font-size: 15px; color: #3b535e; line-height: 1.8; border-top: 1px solid #c8dadd; padding-top: 15px; }
        @media (max-width: 700px) {
            body { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 200px; flex-direction: row; flex-wrap: wrap; padding: 10px; }
            .sidebar h2 { display: none; }
            .menu-item { padding: 8px 15px; font-size: 14px; border-left: none; border-bottom: 2px solid transparent; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>🔄 易 · 六十四卦</h2>
    <div class="menu-item active" data-type="qian">☰ 01 · 乾 (正弦)</div>
    <div class="menu-item" data-type="kun">☷ 02 · 坤 (余弦)</div>
    <div class="menu-item" data-type="tai">☱☷ 11 · 泰 (波动)</div>
    <!-- 在这里继续添加 04 到 64 卦 -->
</div>

<div class="main">
    <div class="top-bar">
        <h1 id="pageTitle">乾 · 元亨利贞</h1>
        <span id="pageTypeTag">正弦周期</span>
    </div>
    <div class="content-area">
        <div class="canvas-wrapper">
            <canvas id="functionCanvas" width="600" height="400"></canvas>
        </div>
        <div class="info-wrapper">
            <div class="card-box">
                <div class="chapter" id="dispChapter">《易经 · 乾卦》</div>
                <div class="quote" id="dispQuote">天行健，君子以自强不息。</div>
                <div class="explain" id="dispExplain">正弦波起起伏伏，如天道运行永不停歇。乾卦六爻，正是六个波段的跃迁。</div>
            </div>
            <div style="font-size:13px; color:#8a9ea5; text-align:right; padding-right:10px;">💡 点击左侧卦名切换</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  📦 易经数据仓库 (卦象映射为周期函数)
    // ============================================================
    const MODULES = {
        qian: {
            title: '乾 · 元亨利贞',
            tag: '正弦周期',
            chapter: '《易经 · 乾卦》',
            quote: '天行健，君子以自强不息。',
            explain: '正弦波起伏如天道刚健，初九潜龙(波谷)，九五飞龙(波峰)，上九亢龙(回落)。阴阳在周期中流转。',
            func: 'sine'
        },
        kun: {
            title: '坤 · 厚德载物',
            tag: '余弦周期',
            chapter: '《易经 · 坤卦》',
            quote: '地势坤，君子以厚德载物。',
            explain: '余弦波与正弦相位不同，如大地顺承天道。柔顺中含万有，默默承载一切起伏。',
            func: 'cosine'
        },
        tai: {
            title: '泰 · 小往大来',
            tag: '阻尼波动',
            chapter: '《易经 · 泰卦》',
            quote: '天地交，泰。后以财成天地之道。',
            explain: '阻尼振荡如泰卦，阴阳交融互通，虽有波动但终归于平衡（地天交泰）。',
            func: 'damped'
        }
        // ===== 在这里继续添加 04 到 64 卦 =====
    };

    // ============================================================
    //  🎨 画图 (支持正弦、余弦、阻尼)
    // ============================================================
    const canvas = document.getElementById('functionCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const pad = 50;

    function toPixelX(x) { return pad + (x + 3) / 6 * (W - 2 * pad); }
    function toPixelY(y) { return pad + (3 - y) / 6 * (H - 2 * pad); }

    function drawGrid() {
        ctx.strokeStyle = "#d0dfe0";
        ctx.lineWidth = 0.5;
        for (let i = -3; i <= 3; i++) {
            if (i === 0) continue;
            ctx.beginPath(); ctx.moveTo(toPixelX(i), pad); ctx.lineTo(toPixelX(i), H - pad); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pad, toPixelY(i)); ctx.lineTo(W - pad, toPixelY(i)); ctx.stroke();
        }
        ctx.strokeStyle = "#1e2c33";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(pad, toPixelY(0)); ctx.lineTo(W - pad, toPixelY(0)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(toPixelX(0), pad); ctx.lineTo(toPixelX(0), H - pad); ctx.stroke();
        ctx.font = "14px serif";
        ctx.fillStyle = "#1e2c33";
        ctx.fillText("x", W - pad + 5, toPixelY(0) + 5);
        ctx.fillText("y", toPixelX(0) + 5, pad - 5);
        ctx.fillText("O", toPixelX(0) - 18, toPixelY(0) - 8);
    }

    function drawFunction(type) {
        ctx.clearRect(0, 0, W, H);
        drawGrid();
        ctx.strokeStyle = "#3b5e6b";
        ctx.lineWidth = 3.5;
        ctx.shadowColor = "rgba(59, 94, 107, 0.2)";
        ctx.shadowBlur = 10;
        ctx.beginPath();

        let points = 300, startX = -3, endX = 3;
        for (let i = 0; i <= points; i++) {
            let t = i / points;
            let x = startX + t * (endX - startX);
            let y = 0;
            if (type === 'sine') y = Math.sin(x * 1.8);
            else if (type === 'cosine') y = Math.cos(x * 1.8);
            else if (type === 'damped') y = Math.sin(x * 2.5) * Math.exp(-0.3 * Math.abs(x));

            if (y > 3.5) y = 3.5;
            if (y < -3.5) y = -3.5;
            let px = toPixelX(x), py = toPixelY(y);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 标记原点
        ctx.fillStyle = "#3b5e6b";
        ctx.beginPath();
        ctx.arc(toPixelX(0), toPixelY(0), 5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "#1e2c33";
        ctx.font = "12px serif";
        ctx.fillText("太极 · 中", toPixelX(0) + 10, toPixelY(0) - 10);
    }

    // ============================================================
    //  🔄 切换逻辑
    // ============================================================
    function loadModule(key) {
        const data = MODULES[key];
        if (!data) return;
        document.getElementById('pageTitle').innerText = data.title;
        document.getElementById('pageTypeTag').innerText = data.tag;
        document.getElementById('dispChapter').innerText = data.chapter;
        document.getElementById('dispQuote').innerText = data.quote;
        document.getElementById('dispExplain').innerText = data.explain;
        drawFunction(data.func);

        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.menu-item[data-type="${key}"]`)?.classList.add('active');
    }

    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function() {
            if (MODULES[this.dataset.type]) loadModule(this.dataset.type);
        });
    });

    loadModule('qian');
</script>
</body>
</html>
